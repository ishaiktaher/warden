apiVersion: batch/v1
kind: Job
metadata:
  name: warden-production-preflight
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: warden-control-plane}
    spec:
      restartPolicy: Never
      serviceAccountName: warden-control-plane
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: preflight
          image: ghcr.io/ishaiktaher/warden@sha256:replace-with-reviewed-digest
          command: ["python", "-m", "scripts.production_preflight", "--strict"]
          envFrom:
            - configMapRef: {name: warden-config}
            - secretRef: {name: warden-runtime}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
