apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: warden-default-deny
spec:
  podSelector:
    matchLabels: {app: warden-control-plane}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - {protocol: TCP, port: 8000}
  # DNS only. Operators must add reviewed egress policies for PostgreSQL,
  # Redis, OIDC, OTLP, custody providers, and approved connector destinations.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
